# Included inside the claude.gmac.io TLS server block. The same Bob auth
# boundary serves interactive dashboard sessions and narrow server-to-server
# calls; Hermes itself remains loopback-only.
location = /hermes {
    return 308 /hermes/;
}

location = /_bob_hermes_auth {
    internal;
    proxy_pass https://bob.blder.bot/api/internal/hermes-origin-auth;
    proxy_ssl_server_name on;
    proxy_ssl_name bob.blder.bot;
    proxy_set_header Host bob.blder.bot;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Hermes-Auth-Uri $request_uri;
    proxy_set_header X-Hermes-Auth-Method $request_method;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location /hermes/ {
    auth_request /_bob_hermes_auth;
    proxy_pass http://127.0.0.1:9119/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Prefix /hermes;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 300s;
}
