# Host-specific drop-in for hetzner-bob.
# Install: copy to /etc/systemd/system/bob-task-runner.service.d/clone-volume.conf
#   then `systemctl daemon-reload && systemctl restart bob-task-runner`.
#
# /home/bob/dev (the lazy-clone root) is a symlink to a mounted Hetzner volume.
# ProtectSystem=strict in the main unit makes that volume read-only unless it
# is whitelisted here, which otherwise makes every fresh `git clone` fail with
# "Read-only file system" — the runner can then only work repos that already
# exist on disk, and every code-lane issue is unclaimable.
#
# Adjust the mount path to match the node (`readlink -f /home/bob/dev` then the
# volume mountpoint from `findmnt`). ReadWritePaths accumulates across drop-ins,
# so this only ADDS to the main unit's list.
[Service]
ReadWritePaths=/mnt/HC_Volume_106611335
