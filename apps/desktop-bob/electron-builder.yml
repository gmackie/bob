appId: bot.blder.desktop
productName: Bob
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - package.json
extraResources:
  # Map the parent: electron-builder excludes node_modules at a mapping root.
  # Nested runtime node_modules (including pnpm's store) must reach the app.
  - from: .packaging
    to: .
    filter:
      - "bob-server/**/*"
      - "blder/**/*"
      - "db-migrations/**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
linux:
  target:
    - AppImage
    - deb
  category: Development
win:
  target:
    - nsis
