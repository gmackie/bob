appId: com.gmacko.bob.dev
---
- runFlow: helpers/wait-for-bob.yaml
- runFlow:
    when:
      visible: "Skip"
    commands:
      - runFlow: helpers/onboarding-tour.yaml
      - tapOn:
          id: onboarding-step-plan
      - assertVisible: "Use work items to move from intake into execution"
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Continue with GitHub"
    timeout: 30000
- takeScreenshot: screenshots/01-onboarding
