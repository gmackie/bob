[Service]
# The host's distribution Node is currently v20. The repository requires
# Node 24+, which is installed through the host's system Nix profile.
# `tsx` uses `/usr/bin/env node`, so the service environment must select the
# supported runtime explicitly rather than inheriting systemd's default PATH.
Environment=PATH=/nix/var/nix/profiles/default/bin:/home/bob/.local/bin:/usr/local/bin:/usr/bin:/bin
