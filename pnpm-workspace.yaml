packageExtensions:
  drizzle-kit@0.31.11:
    dependencies:
      drizzle-orm: ^0.45.4
allowBuilds:
  esbuild: true # postinstall installs platform binary required for bundling
  node-pty: true # install builds/downloads native PTY bindings used by terminal features
  '@prisma/client': false # optional better-auth peer, auto-installed; we don't use Prisma, so skip its `prisma generate` postinstall
  '@sentry/cli': true # postinstall installs CLI binary used for source map uploads
  better-sqlite3: true # install downloads/builds native SQLite binding
  core-js: false # postinstall polyfill maintenance is optional and not runtime setup
  electron-winstaller: true # install selects the architecture-specific 7zip binary for Windows packaging
  protobufjs: true # postinstall generates runtime reflection code required by package
  redis-memory-server: false # postinstall local test server download is not needed by app runtime
  workerd: true # postinstall downloads Cloudflare runtime used for local worker execution

blockExoticSubdeps: true
minimumReleaseAge: 5760
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
strictDepBuilds: true
