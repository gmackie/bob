# Preflight build — ForgeGraph CI → Preflight build farm
#
# On push (and on demand) it enqueues a Preflight build of the *exact pushed
# commit*. The build runs on the Preflight build farm (the macOS runner), NOT
# in CI: CI only POSTs a source binding. The runner clones/fetches the commit
# into a dedicated clean checkout `/Volumes/T9-APFS/apps/.preflight-ci/bob`, so it
# never touches a developer's working tree.
#
# GMA-724: configure separate scoped PREFLIGHT_CI_IOS_TOKEN /
# PREFLIGHT_CI_ANDROID_TOKEN after Preflight policy review and rollout.

name: preflight-build
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      platform:
        description: ios | android
        default: ios

env:
  PREFLIGHT_API: https://preflight.forgegraf.com
  WORKSPACE_ID: 00000000-0000-4000-8000-000000000001
  # ---- per-app identity ---------------------------------------------------
  APP_ID: pfapp_bob
  APP_PACKAGE_PATH: apps/mobile-bob
  APP_PACKAGE_NAME: "@bob/mobile"
  APP_EAS_PROFILE: development-hosted-simulator
  # ------------------------------------------------------------------------
  PLATFORM: ${{ github.event.inputs.platform || 'ios' }}

jobs:
  enqueue:
    # `forgegraph-ci` rather than `ubuntu-latest`: this job is a curl and a jq,
    # but ubuntu-latest currently resolves to labnuc alone — hetzner-bob no
    # longer carries that label — and labnuc's capacity is 2, which the long
    # `ci` job keeps full. A one-deep pool meant this 8-second enqueue sat in
    # "Waiting to run" behind a job that can take hours.
    #
    # `forgegraph-ci` is on both machines, so the pool is two deep without
    # opening hetzner-bob (which is also the agent host) to every heavy
    # ubuntu-latest job.
    runs-on: forgegraph-ci
    timeout-minutes: 20
    steps:
      - name: Enqueue Preflight build of this commit
        env:
          PREFLIGHT_CI_IOS_TOKEN: ${{ secrets.PREFLIGHT_CI_IOS_TOKEN }}
          PREFLIGHT_CI_ANDROID_TOKEN: ${{ secrets.PREFLIGHT_CI_ANDROID_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "gmackie/bob" ] || [ "${GITHUB_REF_NAME}" != "master" ]; then
            echo "::error::Native CI policy only allows gmackie/bob master"
            exit 1
          fi
          case "${PLATFORM}" in
            ios) CI_TOKEN="${PREFLIGHT_CI_IOS_TOKEN}" ;;
            android) CI_TOKEN="${PREFLIGHT_CI_ANDROID_TOKEN}" ;;
            *) echo "::error::Native CI platform must be ios or android"; exit 1 ;;
          esac
          case "${CI_TOKEN}" in
            pfci_*) ;;
            *) echo "::error::Configure the platform's dedicated scoped CI credential"; exit 1 ;;
          esac
          # Exact policy root under the Mini runner's external-volume root.
          WORKSPACE_ROOT="/Volumes/T9-APFS/apps/.preflight-ci/bob"
          BODY=$(jq -n \
            --arg workspaceId "${WORKSPACE_ID}" \
            --arg appId "${APP_ID}" \
            --arg packageName "${APP_PACKAGE_NAME}" \
            --arg packagePath "${APP_PACKAGE_PATH}" \
            --arg workspaceRoot "${WORKSPACE_ROOT}" \
            --arg profile "${APP_EAS_PROFILE}" \
            --arg platform "${PLATFORM}" \
            --arg sha "${GITHUB_SHA}" \
            '{workspaceId: $workspaceId, sourceBinding: {
              appId: $appId, packageName: $packageName, packageManager: "pnpm",
              workspaceRoot: $workspaceRoot, packagePath: $packagePath,
              workflowIntent: "prove-app", platform: $platform, lane: "simulator",
              expoConfigDigest: "sha256:ci-deferred", easProfileName: $profile,
              gitRemoteUrl: "https://git.forgegraf.com/gmackie/bob.git",
              gitBranch: "master", gitCommitSha: $sha,
              dirtyWorkspace: false, changedSetupFiles: []
            }}')

          echo "Enqueuing ${PLATFORM}/simulator build of bob@${GITHUB_SHA:0:8}"
          RESP=$(curl --fail -sS -m 60 -X POST "${PREFLIGHT_API}/api/preflight/v1/workflows/prove-app" \
            -H "Authorization: Bearer ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          printf '%s' "${RESP}" | jq -e \
            --arg appId "${APP_ID}" --arg platform "${PLATFORM}" --arg sha "${GITHUB_SHA}" \
            '.data.workflow.appId == $appId and .data.workflow.platform == $platform and
             .data.workflow.lane == "simulator" and .data.sourceBinding.gitCommitSha == $sha' >/dev/null
          echo "Queued source-bound Preflight build for bob"
