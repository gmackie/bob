name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  research-backend:
    name: Research backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: https://github.com/astral-sh/setup-uv@v6

      - name: Install locked Python dependencies
        working-directory: packages/research-backend
        run: uv sync --extra dev --frozen

      - name: Test database-independent research behavior
        working-directory: packages/research-backend
        run: env -u DATABASE_URL uv run pytest --ignore=tests/test_health.py

      - name: Test fail-closed service authentication
        working-directory: packages/research-backend
        env:
          DATABASE_URL: postgresql://unused
        run: uv run pytest tests/test_health.py

      - name: Lint the hardened sidecar boundary
        working-directory: packages/research-backend
        # The legacy sidecar has a tracked Ruff backlog outside this boundary.
        # Keep every file in the production auth/search slice clean while that
        # broader cleanup proceeds independently.
        run: >-
          uv run ruff check
          src/research_backend/auth.py
          src/research_backend/config.py
          src/research_backend/main.py
          src/research_backend/routes/search.py
          tests/test_health.py
          tests/test_pgvector_search.py
          tests/test_service_unit.py

  ci:
    # Whether the failures in this run (if any) touch anything the deployed
    # apps depend on. The deploy jobs gate on this instead of the whole job,
    # so an unrelated package cannot stop every deploy in the repo.
    outputs:
      deployable: ${{ steps.deployable-gate.outputs.deployable }}
    env:
      # check-events v2: typecheck/lint/test each run as a configuration via
      # scripts/ci-check-phase.mjs, every vitest suite appends exact per-test
      # events through the check-events reporter, and the report step folds
      # the stream into `tests` for ForgeGraph (ci/gate → Bob's cockpit).
      FG_CHECK_EVENTS_PATH: ${{ github.workspace }}/.fg/check-events.ndjson
    # No longer needs the forgegraf-docker label / docker-in-docker: postgres
    # is now provided by @gmacko/emulate (a PGlite-backed wire-protocol mock
    # spawned as a plain Node subprocess by test/emulate-setup.ts's vitest
    # globalSetup, coordinated across @bob/db + @bob/api via a lock file --
    # see that file for details). This removes both the fragile dependency on
    # hetzner-bob's narrowly-scoped docker runner label and the "port is
    # already allocated" failures two concurrent job runs used to hit when
    # both tried to bind host port 5432 for their own postgres service
    # container.
    #
    # `@bob/api` (~21 test files) and `@bob/db` (its own vitest suite) require
    # a live Postgres at postgres://postgres:postgres@localhost:5432/test --
    # see those packages' test files for the hardcoded connection string, and
    # test/emulate-setup.ts / emulate.config.yaml for how it's now served.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: https://github.com/pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate deploy install scope
        run: node --test scripts/verify-ci-deploy-install-scope.test.mjs

      - name: Validate OODA runner Node runtime
        run: node --test scripts/verify-ooda-runner-node-runtime.test.mjs

      - name: Validate OODA durable-work rollout
        run: node --test scripts/verify-ooda-durable-work-rollout.test.mjs

      - name: Validate Bob/OODA product boundary
        run: node --test scripts/verify-product-boundary.test.mjs

      - name: Validate the deployable gate
        run: node --test scripts/verify-ci-deployable-gate.test.mjs

      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        # Run one tsc at a time. The default turbo concurrency runs many tscs
        # in parallel, and the big Next.js app (@bob/blder) spikes enough memory
        # that a concurrent run intermittently OOM-kills one (exit 137) under
        # the runner's RAM+swap pressure. Serial typecheck can't collectively
        # exhaust memory. The runner deliberately defaults Node to a 1.5GB heap,
        # but @bob/blder alone can exceed that ceiling, so this one serialized
        # step receives headroom within the job's 5GB container limit.
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        # `--continue` + `continue-on-error` so a failure here does not skip
        # the later steps: the deployable gate needs every check's summary to
        # tell a blocking failure from an irrelevant one. The final gate step
        # still fails the job, so a red run stays red.
        continue-on-error: true
        run: node scripts/ci-check-phase.mjs typecheck -- pnpm exec turbo run typecheck --continue --concurrency=1 --summarize

      - name: Lint
        id: lint
        # Serialize for the same reason as typecheck above: `pnpm lint` is
        # `turbo run lint --continue`, which fans out one eslint process per
        # package with no concurrency cap. Each is 600-800MB, so a full fan-out
        # exhausted RAM *and* swap on the shared runner host — load average
        # reached 150 with every eslint stuck in uninterruptible sleep, which
        # degraded the Forgejo instance sharing that box until the processes
        # were killed. Serial lint cannot collectively exhaust memory.
        continue-on-error: true
        run: node scripts/ci-check-phase.mjs lint -- pnpm exec turbo run lint --continue --concurrency=1 --summarize

      - name: Start emulated Postgres (@gmacko/emulate)
        # `drizzle-kit push` below runs as its own step, outside vitest's
        # globalSetup (test/emulate-setup.ts) which only starts on-demand when
        # a test file first imports it -- so start the emulator explicitly
        # here and leave it running for both this step and `pnpm test` after
        # it. See test/emulate-setup.ts for the lock/coordination logic that
        # lets @bob/db and @bob/api's own vitest processes detect this
        # already-running instance instead of racing to start a second one.
        run: |
          EMULATE_BIN="${PWD}/node_modules/.bin/emulate"
          EMULATE_CONFIG="${PWD}/emulate.config.yaml"
          EMULATE_STATE="$(mktemp -d /tmp/bob-emulate.XXXXXX)"
          mkdir -p "${EMULATE_STATE}/data/pglite"
          cd "${EMULATE_STATE}"
          nohup "${EMULATE_BIN}" start -s postgres --seed "${EMULATE_CONFIG}" \
            > /tmp/emulate.log 2>&1 &
          echo "Waiting for emulated postgres wire protocol on :5432..."
          # A cold npx cache means @gmacko/emulate has to install and compile
          # its bundled Redis (jemalloc + LTO) from source before ANY of its
          # output appears -- measured at ~125s in a genuinely cold container
          # (see netcontrol's test/emulate-setup.ts, which hit the identical
          # issue). 90s wasn't enough headroom and intermittently failed this
          # step outright before the emulator ever got a chance to come up.
          for i in $(seq 1 180); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Emulated postgres never came up on :5432"
          cat /tmp/emulate.log
          exit 1

      - name: Push @bob/db schema to CI Postgres
        working-directory: packages/bob/src/db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
        # drizzle-kit push introspects schema.ts directly and generates a
        # from-scratch schema -- this is the same mechanism client-pglite.ts
        # uses to bootstrap an empty PGlite DB (see its `generateDrizzleJson`/
        # `generateMigration` comments). The incremental SQL files under
        # drizzle/*.sql do NOT compose into a from-scratch schema (they're
        # patches on a pre-existing baseline -- see migrate.ts's docstring),
        # so `pnpm migrate` is not viable here; `push --force` is.
        run: pnpm exec drizzle-kit push --force

      - name: Test
        id: test
        # DATABASE_URL is intentionally NOT set here (unlike the old Docker
        # service-container CI). `turbo run test` runs every package's test
        # script, and a step-level env var would leak into all of them --
        # @gmacko/ooda's listen-broker.test.ts gates its Postgres LISTEN/
        # NOTIFY suite on DATABASE_URL being set, and the emulator's
        # PGlite-backed postgres doesn't support LISTEN/NOTIFY. @bob/db and
        # @bob/api set DATABASE_URL themselves via their own vitest.config.ts
        # `test.env`, scoping it to only the packages that need it.
        continue-on-error: true
        # The reporter flags reach every package's `vitest run` through turbo's
        # `--`; each suite stamps its own stream (npm_package_name) so counts
        # sum across packages. Every package test script in this repo is vitest.
        run: node scripts/ci-check-phase.mjs test -- pnpm exec turbo run test --continue --concurrency=1 --summarize -- --no-file-parallelism --reporter=default --reporter=@forgegraph/check-events/reporters/vitest

      # Which failures, if any, actually matter for shipping. Reads the turbo
      # run summaries the three steps above wrote and intersects the failing
      # packages with the dependency closure of the deployed apps.
      - name: Deployable gate
        id: deployable-gate
        if: always()
        run: |
          if node scripts/ci-deployable-gate.mjs; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          fi

      # `continue-on-error` above means a failed check no longer fails the job
      # on its own, so restate it here: any failing task keeps CI red, exactly
      # as before. Only the *deploy* decision is narrowed.
      - name: Fail the run if any check failed
        if: always()
        run: |
          if [ "${{ steps.typecheck.outcome }}" = "failure" ] \
            || [ "${{ steps.lint.outcome }}" = "failure" ] \
            || [ "${{ steps.test.outcome }}" = "failure" ]; then
            echo "::error::One or more checks failed — see the steps above."
            exit 1
          fi

      - name: Report CI result to ForgeGraph
        if: always()
        env:
          FG_CI_TOKEN: ${{ secrets.FG_CI_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="success"
          elif [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="cancelled"
          else
            STATUS="failure"
          fi

          REPO_FULL="${{ github.repository }}"
          OWNER="${REPO_FULL%%/*}"
          REPO="${REPO_FULL##*/}"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          # On pull_request events github.sha is the test-merge commit, not the branch
          # head. Report the head SHA so it matches the ForgeGraph changeset's git_sha.
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          if [ -z "${FG_CI_TOKEN}" ]; then
            echo "::warning::FG_CI_TOKEN is empty — CI result will NOT be reported to ForgeGraph (forge ci status will stay 'unknown')"
          fi

          # Capture the HTTP status so a failed/unauthenticated report is visible in
          # the logs instead of being silently swallowed.
          # Fold the check-events stream into the inline summary ForgeGraph
          # stores as builds.metadata.tests (exact per-configuration counts +
          # failing test names). Best-effort: no stream → no `tests` field.
          TESTS_FIELD=""
          if [ -f "${FG_CHECK_EVENTS_PATH}" ]; then
            # Diagnostic: what actually reached the shared stream (per-package
            # run_finished counts). Cheap, and the only way to see stream
            # collisions or lost packages from a runner we can't attach to.
            ls -la "${FG_CHECK_EVENTS_PATH}" || true
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { parseCheckEventLine } from "@forgegraph/check-events";
              const ev = readFileSync(process.env.FG_CHECK_EVENTS_PATH, "utf8").split("\n").map(parseCheckEventLine).filter(Boolean);
              const fin = ev.filter((e) => e.event === "run_finished").map((e) => `${e.phase}/${e.stream ?? "-"}=${e.counts ? e.counts.passed + "/" + (e.counts.total ?? "?") : e.status}`);
              console.log(`check-events stream: ${ev.length} events, ${fin.length} run_finished:`, fin.join(" "));
            ' || true
            TESTS_JSON=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { parseCheckEventLine, summarizeChecks } from "@forgegraph/check-events";
              const events = readFileSync(process.env.FG_CHECK_EVENTS_PATH, "utf8").split("\n").map(parseCheckEventLine).filter(Boolean);
              const s = summarizeChecks(events);
              for (const p of s.phases) p.failures = p.failures.slice(0, 20);
              process.stdout.write(JSON.stringify(s));
            ' 2>/dev/null || true)
            if [ -n "${TESTS_JSON}" ]; then
              echo "check-events summary: ${TESTS_JSON:0:400}"
              TESTS_FIELD=", \"tests\": ${TESTS_JSON}"
            fi
          fi

          HTTP=$(curl -s -o /tmp/fg_report.out -w "%{http_code}" -X POST "https://forgegraf.com/api/fg/ci/report" \
            -H "Authorization: Bearer ${FG_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"owner\": \"${OWNER}\",
              \"repo\": \"${REPO}\",
              \"sha\": \"${SHA}\",
              \"branch\": \"${BRANCH}\",
              \"status\": \"${STATUS}\",
              \"runId\": \"${{ github.run_id }}\",
              \"runUrl\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"workflowName\": \"CI\"${TESTS_FIELD}
            }")
          echo "ForgeGraph CI report: HTTP ${HTTP}"
          if [ "${HTTP}" -lt 200 ] || [ "${HTTP}" -ge 300 ]; then
            echo "::warning::ForgeGraph CI report failed (HTTP ${HTTP}): $(cat /tmp/fg_report.out 2>/dev/null)"
          fi

  # Continuous deploy: ship the web app to bob.blder.bot after CI passes on master.
  #
  # Requires repo secrets:
  #   CLOUDFLARE_API_TOKEN   - token with Workers Scripts:Edit + Hyperdrive read
  #   CLOUDFLARE_ACCOUNT_ID  - c07a7e704db1808e1fff91bed2b1cd49
  #
  # NOTE: this is a CODE-ONLY deploy. The `predeploy` DB migration
  # (scripts/migrate-hetzner.sh) reaches Postgres over Tailscale and cannot run
  # on a cloud runner, so it's intentionally skipped here (we call `vinext deploy`
  # directly, not `pnpm deploy`). When a deploy includes schema changes, run
  # migrations first from a Tailscale-connected host:
  #   DATABASE_URL=$(forge db url --app bob) pnpm -F @bob/db migrate
  # (or use scripts/rotate-bob-db-password.sh's stable creds). To make this fully
  # automated, move this job to a self-hosted runner on the Tailscale mesh.
  deploy:
    name: Deploy web to bob.blder.bot
    needs: ci
    # `always()` so this job RUNS on a red ci instead of being skipped.
    # A skipped job reports success, which is why three separate deploy
    # blocks on 2026-08-23/24 went unnoticed: the commit status looked
    # fine and the deploy simply never happened. The guard step below
    # keeps the same safety property — no deploy on red — but says so.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Cloudflare deploys need a runner with a healthy, direct DNS/egress path.
    # Keep them off the general CI pool so a degraded node cannot consume
    # Wrangler's request timeout before it reaches the API.
    runs-on: forgegraph-worker
    steps:
      - name: Refuse to deploy when a dependency of this app failed
        if: needs.ci.outputs.deployable != 'true'
        run: |
          echo "::error::Deploy blocked — a package this app depends on failed CI."
          echo "The gate is scoped: only failures inside the deployed apps'"
          echo "dependency closure block shipping. See the 'Deployable gate'"
          echo "step in the ci job for exactly which task failed."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The web build currently consumes root-hoisted workspace dependencies,
      # so retain the full install while suppressing unrelated desktop binaries.
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm install --frozen-lockfile
      - name: Deploy CF Worker (vinext deploy, code-only)
        working-directory: apps/bob
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Wrangler occasionally reaches Cloudflare but times out waiting for its
        # API response. Retry only that exact transient; configuration, auth,
        # build, and other deploy failures still fail on the first attempt.
        run: ../../scripts/retry-cloudflare-command.sh pnpm exec vinext deploy

  # OODA is promoted independently from the Bob web worker and only after the
  # guarded database bootstrap has completed. The repository secret is a
  # deliberate kill switch: absent/false means the job succeeds without
  # touching Cloudflare, so merging code can never race ahead of migrations.
  deploy-ooda-edge:
    name: Deploy OODA edge (approval-gated)
    needs: ci
    # `always()` so this job RUNS on a red ci instead of being skipped.
    # A skipped job reports success, which is why three separate deploy
    # blocks on 2026-08-23/24 went unnoticed: the commit status looked
    # fine and the deploy simply never happened. The guard step below
    # keeps the same safety property — no deploy on red — but says so.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: forgegraph-worker
    steps:
      - name: Refuse to deploy when a dependency of this app failed
        if: needs.ci.outputs.deployable != 'true'
        run: |
          echo "::error::Deploy blocked — a package this app depends on failed CI."
          echo "The gate is scoped: only failures inside the deployed apps'"
          echo "dependency closure block shipping. See the 'Deployable gate'"
          echo "step in the ci job for exactly which task failed."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm install --frozen-lockfile
      - name: Build and conditionally deploy OODA edge
        working-directory: apps/ooda-edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OODA_EDGE_DEPLOY_ENABLED: ${{ secrets.OODA_EDGE_DEPLOY_ENABLED }}
          FORGEGRAPH_API_KEY: ${{ secrets.FORGEGRAPH_API_KEY }}
          RESEARCH_SERVICE_TOKEN: ${{ secrets.RESEARCH_SERVICE_TOKEN }}
        run: |
          pnpm exec vinext build
          if [ "${OODA_EDGE_DEPLOY_ENABLED}" != "true" ]; then
            echo "OODA edge deploy disabled; set OODA_EDGE_DEPLOY_ENABLED=true only after the production schema bootstrap"
            exit 0
          fi
          test -n "${FORGEGRAPH_API_KEY}"
          test -n "${RESEARCH_SERVICE_TOKEN}"
          printf '%s' "${FORGEGRAPH_API_KEY}" | pnpm exec wrangler secret put FORGEGRAPH_API_KEY --name ooda-blder-bot
          printf '%s' "${RESEARCH_SERVICE_TOKEN}" | pnpm exec wrangler secret put RESEARCH_SERVICE_TOKEN --name ooda-blder-bot
          ../../scripts/retry-cloudflare-command.sh pnpm exec vinext deploy
